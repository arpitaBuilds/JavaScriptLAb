<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Fitness | Join the club</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        :root { --ink: #15251f; --muted: #718079; --line: #dce7df; --mint: #c9f36b; --green: #174d3b; --paper: #f7faf5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 16px; color: var(--ink); font-family: 'DM Sans', sans-serif; background: #d9e9d7; background-image: radial-gradient(circle at 12% 18%, rgba(201, 243, 107, .55), transparent 28%), linear-gradient(135deg, #d9e9d7 0%, #f6f7ed 48%, #b9d7c5 100%); }
        .container { width: min(100%, 900px); overflow: hidden; display: grid; grid-template-columns: .8fr 1.2fr; background: var(--paper); border: 1px solid rgba(255, 255, 255, .75); border-radius: 24px; box-shadow: 0 24px 70px rgba(31, 72, 52, .2); }
        .intro { position: relative; padding: 48px 36px; color: #f5faed; background: var(--green); isolation: isolate; }
        .intro::after { content: ''; position: absolute; z-index: -1; width: 210px; height: 210px; right: -82px; bottom: -72px; border: 28px solid rgba(201, 243, 107, .7); border-radius: 50%; }
        .eyebrow { margin: 0 0 42px; color: var(--mint); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        h1, h2 { font-family: 'Space Grotesk', sans-serif; }
        h1 { max-width: 260px; margin: 0 0 18px; font-size: clamp(36px, 5vw, 54px); line-height: .98; letter-spacing: -1px; }
        .intro-copy { max-width: 270px; margin: 0; color: #c7d9ce; line-height: 1.7; }
        .stat { margin-top: 70px; color: var(--mint); font-size: 34px; font-weight: 700; }
        .stat-label { color: #c7d9ce; font-size: 13px; }
        form { padding: 42px clamp(24px, 5vw, 58px); }
        h2 { margin: 0 0 8px; font-size: 28px; }
        .form-note { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
        .field { display: flex; min-width: 0; flex-direction: column; gap: 7px; }
        .field.full { grid-column: 1 / -1; }
        label { color: #365248; font-size: 13px; font-weight: 700; }
        input, select { width: 100%; padding: 13px 14px; color: var(--ink); font: inherit; background: #fff; border: 1px solid var(--line); border-radius: 10px; outline: none; transition: border-color .2s, box-shadow .2s; }
        input:focus, select:focus { border-color: #72a94d; box-shadow: 0 0 0 4px rgba(114, 169, 77, .15); }
        .error { min-height: 0; color: #bd4e3e; font-size: 12px; }
        .check-row { display: flex; align-items: flex-start; gap: 10px; margin: 24px 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
        .check-row input { width: 17px; height: 17px; flex: 0 0 auto; margin: 1px 0 0; accent-color: var(--green); }
        button { width: 100%; padding: 14px; border: 0; border-radius: 10px; color: var(--ink); background: var(--mint); font: 700 15px 'DM Sans', sans-serif; cursor: pointer; transition: transform .2s, background .2s; }
        button:hover { background: #b9e657; transform: translateY(-2px); }
        #message { min-height: 20px; margin: 16px 0 0; color: #27734d; text-align: center; font-size: 14px; font-weight: 600; }
        @media (max-width: 680px) { .container { grid-template-columns: 1fr; } .intro { padding: 32px 28px; } .eyebrow { margin-bottom: 30px; } .stat { margin-top: 32px; } form { padding: 32px 24px; } }
    </style>
</head>
<body>
    <main class="container">
        <section class="intro">
            <p class="eyebrow">Forge Fitness / 2025</p>
            <h1>Build the strongest version of you.</h1>
            <p class="intro-copy">A focused space, expert coaching, and a community that keeps you moving.</p>
            <div class="stat">24/7</div>
            <div class="stat-label">access for members</div>
        </section>
        <form id="admissionForm" novalidate>
            <h2>Start your journey</h2>
            <p class="form-note">Tell us a little about yourself to get started.</p>
            <div class="form-grid">
                <div class="field full">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Aarav Sharma" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="16" max="70" placeholder="18 - 70" required>
                    <div class="error" id="ageError"></div>
                </div>
                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="98765 43210" autocomplete="tel" required>
                    <div class="error" id="phoneError"></div>
                </div>
                <div class="field full">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    <div class="error" id="emailError"></div>
                </div>
                <div class="field">
                    <label for="goal">Fitness goal</label>
                    <select id="goal" name="goal" required>
                        <option value="">Choose a goal</option>
                        <option value="strength">Build strength</option>
                        <option value="fitness">Improve fitness</option>
                        <option value="weight-loss">Lose weight</option>
                        <option value="muscle">Gain muscle</option>
                    </select>
                </div>
                <div class="field">
                    <label for="plan">Membership plan</label>
                    <select id="plan" name="plan" required>
                        <option value="">Choose a plan</option>
                        <option value="monthly">Monthly - Rs. 1,499</option>
                        <option value="quarterly">Quarterly - Rs. 3,999</option>
                        <option value="yearly">Yearly - Rs. 11,999</option>
                    </select>
                </div>
            </div>
            <label class="check-row" for="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <span>I agree to the membership terms and confirm that the details above are correct.</span>
            </label>
            <div class="error" id="termsError"></div>
            <button type="submit">Join Forge Fitness <span aria-hidden="true">&#8594;</span></button>
            <p id="message" role="status"></p>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
