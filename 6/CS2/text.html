<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Student Profile Parser</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Segoe UI, Arial;
      background: linear-gradient(135deg, #eef2ff, #ecfeff);
      display: grid;
      place-items: center;
      padding: 28px;
      color: #172033;
    }

    .wrap {
      width: min(860px, 100%);
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 22px 60px #0f172a22;
    }

    .hero {
      padding: 30px;
      color: #fff;
      background: linear-gradient(135deg, #312e81, #0f766e);
    }

    .hero small {
      font-weight: 800;
      letter-spacing: 1.4px;
      opacity: .8;
    }

    .hero h1 {
      margin: 9px 0 5px;
    }

    .hero p {
      margin: 0;
      opacity: .82;
    }

    .panel {
      padding: 28px;
    }

    textarea {
      width: 100%;
      height: 170px;
      padding: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      resize: vertical;
      outline: 0;
      font-size: 15px;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .item {
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      background: #f8fafc;
    }

    .item span {
      display: block;
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 5px;
    }

    .item strong {
      word-break: break-word;
    }

    .section {
      margin-top: 18px;
      padding: 17px;
      border-radius: 16px;
      background: #f5f3ff;
    }

    .section h3 {
      margin: 0 0 8px;
      color: #312e81;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="hero">
      <small>CASE STUDY 02 • REGEX EXTRACTION</small>
      <h1>AI Student Profile Parser 🤖</h1>
      <p>Convert an unstructured paragraph into useful student data.</p>
    </header>

    <section class="panel">
      <textarea id="text"
        placeholder="Hi, I am Ananya Sharma. My roll number is 42 and my email is ananya@gmail.com. You can reach me at 9876543210. I study Computer Science."></textarea>
      <button onclick="analyzeText()">Extract & Analyze ✨</button>
      <div id="output">
        <div class="section">Your extracted profile will appear here.</div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
