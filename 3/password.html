<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>Spotify Login Validation</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url("bg1.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}
.container{
    width:380px;
    padding:35px;
    border-radius:20px;
    background:rgba(24,24,24,0.65);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}
.logo{
    text-align:center;
    font-size:42px;
    color:#1DB954;
    font-weight:bold;
    margin-bottom:8px;
}
h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}
label{
    display:block;
    color:white;
    margin:15px 0 8px;
    font-weight:600;
}
input{
    width:100%;
    padding:14px;
    border:2px solid #333;
    background:#2A2A2A;
    color:white;
    border-radius:8px;
    outline:none;
    transition:.3s;
    font-size:15px;
}
input:focus{
    border-color:#1DB954;
    box-shadow:0 0 10px rgba(29,185,84,.4);
}
button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#1DB954;
    color:white;
    border:none;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    background:#1ed760;
    transform:scale(1.03);
}
#message{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}
.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:13px;
}
.password-info{
    margin-top:12px;
    padding:12px 15px;
    background:rgba(255,255,255,0.08);
    border-left:4px solid #1db954;
    border-radius:8px;
}
.password-info p{
    color:#1DB954;
    font-weight:bold;
    margin-bottom:8px;
}
.password-info ul{
    padding-left:18px;
}
.password-info li{
    color:#ddd;
    margin:5px 0;
    font-size:14px;
}
</style>
</head>
<body>
<div class="container">
<div class="logo">
    <i class="fa-brands fa-spotify"></i>
    <h3>Spotify</h3>
</div>
<h2>Login</h2>
<label>Username</label>
<input type="text" id="username" placeholder="Enter Username">
<label>Password</label>
<input type="password" id="password" placeholder="Enter Password">
<div class="password-info">
    <p>Password must contain:</p>
    <ul>
        <li>At least 8 characters</li>
        <li>One uppercase letter (A–Z)</li>
        <li>One lowercase letter (a–z)</li>
        <li>One number (0–9)</li>
        <li>One special character (@, #, $, %, &, etc.)</li>
    </ul>
</div>
<button onclick="validate()">Login</button>
<p id="message"></p>
<div class="footer">
Designed by Arpita Waghmare :D
</div>
</div>
<script>
function validate(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let msg = document.getElementById("message");
    if(username == ""){
        msg.style.color = "red";
        msg.innerHTML = "Enter Username";
        return;
    }
    if(password == ""){
        msg.style.color = "red";
        msg.innerHTML = "Enter Password";
        return;
    }
    if(password.length < 8){
        msg.style.color = "red";
        msg.innerHTML = "Password should be at least 8 characters.";
    }
    else if(password.search(/[A-Z]/) == -1){
        msg.style.color = "red";
        msg.innerHTML = "Add one uppercase letter.";
    }
    else if(password.search(/[a-z]/) == -1){
        msg.style.color = "red";
        msg.innerHTML = "Add one lowercase letter.";
    }
    else if(password.search(/[0-9]/) == -1){
        msg.style.color = "red";
        msg.innerHTML = "Add one number.";
    }
    else if(password.search(/[@#$%^&*!]/) == -1){
        msg.style.color = "red";
        msg.innerHTML = "Add one special character.";
    }
    else{
        msg.style.color = "#1DB954";
        msg.innerHTML = "Login Successful";
    }
}
</script>
</body>
</html>
