<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Checker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#e09ca9,#8ac4d0,#6e8dd5);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#ff4d6d;
    border-radius:50%;
    filter:blur(140px);
    top:-100px;
    left:-80px;
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#00f5ff;
    border-radius:50%;
    filter:blur(120px);
    bottom:-80px;
    right:-80px;
}

.container{

    position:relative;
    z-index:10;

    width:420px;

    padding:35px;

    border-radius:25px;

    backdrop-filter:blur(18px);

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 0 40px rgba(0,0,0,.25);

    text-align:center;

}

h2{

    color:white;

    font-size:32px;

    margin-bottom:25px;

    letter-spacing:1px;

    text-shadow:0 0 10px cyan;

}

label{

    color:white;

    display:block;

    text-align:left;

    margin-bottom:10px;

    font-size:17px;

}

input[type=text]{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.15);

    color:white;

    font-size:16px;

    border:2px solid transparent;

    transition:.4s;

}

input::placeholder{

    color:#ddd;

}

input[type=text]:focus{

    border:2px solid cyan;

    box-shadow:0 0 20px cyan;

}

input[type=button]{

    margin-top:22px;

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:linear-gradient(90deg,#e09ca9,#8ac4d0,#6e8dd5);

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.4s;

}

input[type=button]:hover{

    transform:translateY(-5px);

    box-shadow:0 0 30px #00f5ff;

}

</style>

<script src="script.js"></script>

</head>

<body>

<div class="container">

<h2>🔍 Palindrome Checker</h2>

<label>Enter a Word</label>

<input type="text" id="word" placeholder="Type here...">

<input type="button" value="✨ Check Now" onclick="checkPalindrome()">

</div>

</body>
</html>
